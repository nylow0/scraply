name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun audit --prod
      - name: Audit dev dependencies (advisory)
        continue-on-error: true
        run: bun audit
      - run: bun run check
      - name: Prepare pinned native runtime
        run: bun run prepare:runtime
      - name: Build unpacked production app
        run: bun run build && bunx electron-builder --win --dir --publish never
      - name: Smoke packaged production app
        run: bun run test:e2e:production
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/

[workspace]
members = [
    "crates/scraply-agent-cli",
    "crates/scraply-agent-core",
    "crates/scraply-agent-providers",
]
exclude = ["vendor/openai-codex"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

# Required by the pinned private OpenAI authentication adapter. Keep these
# revisions in lockstep with vendor/openai-codex/codex-rs/Cargo.toml.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

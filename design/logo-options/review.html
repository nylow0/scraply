<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scraply logo options</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 42px;
        background: #0b0d0b;
        color: #f2f4f0;
        font-family: "Segoe UI Variable Text", "Aptos", system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #a3aba3;
        font-size: 14px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 18px;
      }
      article {
        overflow: hidden;
        border: 1px solid #2d332e;
        border-radius: 14px;
        background: #151815;
      }
      img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
      }
      .meta {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 13px 14px 15px;
        border-top: 1px solid #2d332e;
      }
      strong {
        color: #d2b45e;
        font-size: 15px;
      }
      span {
        color: #d9ddd7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Scraply logo directions</h1>
      <p>Pick a number. The winner will be rebuilt as a crisp production vector.</p>
    </header>
    <main>
      <article><img src="01-torn-s.png" alt="" /><div class="meta"><strong>01</strong><span>Torn S</span></div></article>
      <article><img src="02-synthesis-prism.png" alt="" /><div class="meta"><strong>02</strong><span>Synthesis prism</span></div></article>
      <article><img src="03-research-lens.png" alt="" /><div class="meta"><strong>03</strong><span>Research lens</span></div></article>
      <article><img src="04-insight-stack.png" alt="" /><div class="meta"><strong>04</strong><span>Insight stack</span></div></article>
      <article><img src="05-evidence-extractor.png" alt="" /><div class="meta"><strong>05</strong><span>Evidence extractor</span></div></article>
      <article><img src="06-evidence-aperture.png" alt="" /><div class="meta"><strong>06</strong><span>Evidence aperture</span></div></article>
      <article><img src="07-folded-ribbon.png" alt="" /><div class="meta"><strong>07</strong><span>Folded ribbon</span></div></article>
      <article><img src="08-six-streams.png" alt="" /><div class="meta"><strong>08</strong><span>Six streams</span></div></article>
      <article><img src="09-evidence-knot.png" alt="" /><div class="meta"><strong>09</strong><span>Evidence knot</span></div></article>
      <article><img src="10-source-compass.png" alt="" /><div class="meta"><strong>10</strong><span>Source compass</span></div></article>
    </main>
  </body>
</html>
